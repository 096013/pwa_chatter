{% extends "base.html" %}

{% block title %}個人設定 | 點讚聊天室{% endblock %}

{% block content %}
<section class="panel" style="max-width: 560px; margin: 0 auto;">
  <div class="stack">
    <div>
      <h2>Screen4：修改密碼</h2>
      <p class="hint">輸入舊密碼與新密碼後更新帳號設定，流程對應 PDF 的 Screen4。</p>
    </div>

    <form method="post" class="form-grid">
      <label>
        舊密碼
        <input type="password" name="old_password" autocomplete="current-password" required>
      </label>
      <label>
        新密碼
        <input type="password" name="new_password" autocomplete="new-password" required>
      </label>
      <label>
        確認新密碼
        <input type="password" name="confirm_password" autocomplete="new-password" required>
      </label>
      <div class="actions">
        <button class="btn" type="submit">更新密碼</button>
        <a class="btn alt" href="{{ url_for('board') }}">回留言板</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
